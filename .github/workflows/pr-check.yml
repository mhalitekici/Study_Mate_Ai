name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint auth-service
        run: |
          flake8 services/auth-service/app \
            --max-line-length=120 \
            --exclude=__pycache__ \
            || true

      - name: Lint ai-service
        run: |
          flake8 services/ai-service/app \
            --max-line-length=120 \
            --exclude=__pycache__ \
            || true

      - name: Lint multi-agent
        run: |
          flake8 agents/multi-agent/app \
            --max-line-length=120 \
            --exclude=__pycache__ \
            || true

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate manifests
        run: |
          find infra/kubernetes/manifests -name "*.yaml" \
            -exec kubeval {} \; || true

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Lint Helm charts
        run: |
          helm lint infra/helm/studymate-ai || true

      - name: Template Helm charts
        run: |
          helm template studymate-ai infra/helm/studymate-ai \
            --namespace studymate \
            --debug || true