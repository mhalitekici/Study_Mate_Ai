name: StudyMate AI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── TEST ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install auth-service dependencies
        run: |
          cd services/auth-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run auth-service tests
        run: |
          cd services/auth-service
          python -m pytest tests/ -v --tb=short || echo "No tests found"

      - name: Install recsys-service dependencies
        run: |
          cd services/recsys-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run recsys-service tests
        run: |
          cd services/recsys-service
          python -m pytest tests/ -v --tb=short || echo "No tests found"

  # ─── BUILD ──────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: auth-service
            path: services/auth-service
            port: 8001
          - name: material-service
            path: services/material-service
            port: 8002
          - name: ai-service
            path: services/ai-service
            port: 8003
          - name: memory-service
            path: services/memory-service
            port: 8004
          - name: recsys-service
            path: services/recsys-service
            port: 8005
          - name: multi-agent
            path: agents/multi-agent
            port: 8010

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/studymate-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── SECURITY SCAN ──────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─── DEPLOY ─────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Update Helm values with new image tag
        run: |
          IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s/imageTag: latest/imageTag: $IMAGE_TAG/" infra/helm/studymate-ai/values.yaml

      - name: Deploy with Helm
        run: |
          helm upgrade --install studymate-ai infra/helm/studymate-ai \
            --namespace studymate \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set global.imageTag=sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/auth-service -n studymate
          kubectl rollout status deployment/ai-service -n studymate
          kubectl rollout status deployment/multi-agent -n studymate
          kubectl get pods -n studymate

  # ─── NOTIFY ─────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed!"
          echo "Check logs for details"
          exit 1