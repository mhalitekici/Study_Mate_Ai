version: '3.9'

services:
  locust-master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --master
      --host=http://host.docker.internal:8000
    networks:
      - locust-network

  locust-worker:
    image: locustio/locust
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host=locust-master
    networks:
      - locust-network
    deploy:
      replicas: 3

networks:
  locust-network:
    driver: bridge