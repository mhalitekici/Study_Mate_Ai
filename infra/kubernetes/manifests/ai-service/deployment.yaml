apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: studymate
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: studymate/ai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: OLLAMA_MODEL
              value: "qwen3.5:4b"
            - name: MEMORY_SERVICE_URL
              value: "http://memory-service:8004"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: studymate
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP
