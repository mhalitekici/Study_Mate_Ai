apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: studymate-vs
  namespace: studymate
spec:
  hosts:
    - studymate.local
  http:
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: auth-service
            port:
              number: 8001
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure

    - match:
        - uri:
            prefix: /api/materials
      route:
        - destination:
            host: material-service
            port:
              number: 8002
      retries:
        attempts: 3
        perTryTimeout: 10s

    - match:
        - uri:
            prefix: /api/ai
      route:
        - destination:
            host: ai-service
            port:
              number: 8003
      timeout: 180s
      retries:
        attempts: 2
        perTryTimeout: 90s

    - match:
        - uri:
            prefix: /api/agent
      route:
        - destination:
            host: multi-agent
            port:
              number: 8010
      timeout: 300s
      retries:
        attempts: 2
        perTryTimeout: 150s

    - match:
        - uri:
            prefix: /api/memory
      route:
        - destination:
            host: memory-service
            port:
              number: 8004

    - match:
        - uri:
            prefix: /api/recsys
      route:
        - destination:
            host: recsys-service
            port:
              number: 8005