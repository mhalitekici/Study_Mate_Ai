{{- if .Values.aiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ai-service
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.aiService.replicas }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: {{ .Values.global.imageRegistry }}/{{ .Values.aiService.image }}:{{ .Values.global.imageTag }}
          ports:
            - containerPort: {{ .Values.aiService.port }}
          env:
            - name: OLLAMA_MODEL
              value: {{ .Values.aiService.env.ollamaModel }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers }}
          resources:
            {{- toYaml .Values.aiService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.aiService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: ai-service
  ports:
    - port: {{ .Values.aiService.port }}
      targetPort: {{ .Values.aiService.port }}
  type: ClusterIP
{{- end }}