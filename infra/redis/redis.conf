# Redis Configuration for StudyMate AI

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 0

# Cache TTL defaults
# AI answers: 3600s (1 hour)
# Token validation: 300s (5 minutes)