events {
    worker_connections 1024;
}

http {
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream servers
    upstream auth_service {
        server auth-service:8001;
    }

    upstream material_service {
        server material-service:8002;
    }

    upstream memory_service {
        server memory-service:8004;
    }

    upstream ai_service {
        server ai-service:8003;
    }

    upstream multi_agent {
        server multi-agent:8010;
    }

    upstream recsys_service {
        server recsys-service:8005;
    }

    server {
        listen 80;
        server_name localhost;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Health check
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # Auth Service
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Material Service
        location /api/materials/ {
            proxy_pass http://material_service/materials/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 50M;
        }

        # Memory Service
        location /api/memory/ {
            proxy_pass http://memory_service/memory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # AI Service
        location /api/ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
        }

        # Multi-Agent
        location /api/agent/ {
            proxy_pass http://multi_agent/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # RecSys Service
        location /api/recsys/ {
            proxy_pass http://recsys_service/recsys/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Metrics
        location /metrics {
            proxy_pass http://auth_service/metrics;
            proxy_set_header Host $host;
        }
    }
}